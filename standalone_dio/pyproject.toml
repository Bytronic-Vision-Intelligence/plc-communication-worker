[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "standalone-dio"
version = "0.1.0"
description = "Standalone DIO bridge and Vecow pin worker (no monorepo dependencies)"
requires-python = ">=3.10"
dependencies = [
    "filelock>=3.0",
    "paho-mqtt>=1.6",
    "PyYAML>=6.0",
]

[project.scripts]
dio-worker = "dio.worker:main"
dio-service = "dio.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["dio"]
