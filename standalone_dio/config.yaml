# Standalone DIO configuration (self-contained — not the vision orchestrator profile).
#
# Run worker (hardware pins over MQTT):
#   python run_worker.py --config config.yaml
#
# Run mapping service (handlers → MQTT DO commands):
#   python run_service.py --config config.yaml

dio_enabled: true

mqtt:
  broker: localhost
  port: 1883
  qos: 1
  username: ""
  password: ""
  keepalive: 60
  topics:
    command: vision/command

dio:
  topics:
    di: dio/input
    do: dio/output
  di_count: 0
  do_count: 8
  dio_reset_delay: 2.0
  di_poll_hz: 20
  # Optional override of dio/handlers/dio_configs.yaml
  # pin_mapping:
  #   do:
  #     fail: 0
  #     pass: 3

# Local handler modules under dio/handlers/ (basename without .py)
handlers:
  - do_handlers
